#:schema https://docs.jj-vcs.dev/latest/config-schema.json

[user]
name = "Stefan Codrescu"
email = "ssmmcc1@gmail.com"

[aliases]
co = [
    "util",
    "exec",
    "--",
    "sh",
    "-c",
    "PARENT=$(jj log -r @ --no-graph -T 'change_id.shortest()') && jj commit && jj rebase -s \"children($PARENT) ~ @\" -d @",
]
poh = ["git", "push"]
pom = ["git", "fetch"]
l = ["log", "-r", "main | immutable_heads()-..@ | @::"]
la = [
    "log",
    "-r",
    "main | immutable_heads()-..@ | (immutable_heads()-..@):: | @::",
]
lm = ["log", "-r", "mine()"]
d = ["diff"]
e = ["edit"]
bclean = [
    "util",
    "exec",
    "--",
    "sh",
    "-c",
    "jj b l -r '((bookmarks() & mutable() & committer_date(before:\"2 weeks ago\")) | (bookmarks() & immutable() ~ immutable_bookmarks())) ~ bookmarks(glob:\"review/*\")' -T 'name ++ \"\\n\"' | grep -v '^$' | xargs -r jj b f",
]
bforget = [
    "util",
    "exec",
    "--",
    "sh",
    "-c",
    "jj b l -r 'bookmarks() & ~mine() & ~main ~ bookmarks(glob:\"review/*\")' -T 'name ++ \"\\n\"' | grep -v '^$' | xargs -r jj b f",
]
rev = ["new", "--insert-after"]
rr = ["rebase", "-s", "roots(mutable() & mine())", "-d", "main"]
collapse = ["squash", "--from", "main..@", "--into", "@", "--ignore-immutable"]

# Stack nav: stack forward (sf) and stack backward (sb).
sf = ["edit", "@+"]
sff = ["edit", "@++"]
sfff = ["edit", "@+++"]
sb = ["edit", "@-"]
sbb = ["edit", "@--"]
sbbb = ["edit", "@---"]

[snapshot]
max-new-file-size = 41943040


[remotes.origin]
auto-track-bookmarks = "glob:stefan/*"

[revset-aliases]
"immutable_bookmarks()" = "main"
"trunk()" = "main@origin"
"pr_reviews()" = "bookmarks(glob:'review/*')::"
"closest_pushable(to)" = "heads(::to & mutable() & ~description(exact:'') & (~empty() | merges()))"
# Based on https://github.com/jj-vcs/jj/discussions/5568#discussioncomment-12674748
"closest_bookmarks()" = "closest_bookmarks(@-)"
"closest_bookmarks(to)" = "heads(::to & bookmarks())"

[revsets]
log = "present(@) | (ancestors(immutable_heads().., 2) ~ pr_reviews()) | present(trunk())"
# https://github.com/jj-vcs/jj/issues/9079#issuecomment-4042768244
bookmark-advance-from = "closest_bookmarks(to) ~ immutable_bookmarks()"
# https://github.com/jj-vcs/jj/pull/8830#issuecomment-3952394421
bookmark-advance-to = "closest_pushable(@)"

[templates]
draft_commit_description = '''
concat(
  builtin_draft_commit_description,
  "\nJJ: ignore-rest\n",
  diff.git(),
)
'''

[ui]
default-command = "log"
diff-formatter = [
    "difft",
    "--width=$width",
    "--color=always",
    "$left",
    "$right",
]
