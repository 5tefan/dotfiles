# Ported from p10k (p10k.zsh, lean one-line style, transparent background).
# Layout matches p10k:
#   left:  dir, vcs, prompt_char
#   right: status, duration, jobs, direnv, tool versions, k8s, terraform,
#          gcloud, user@host
# Icons are short text labels (pre-existing choice); colors are p10k's
# 256-color values.

"$schema" = 'https://starship.rs/config-schema.json'

# p10k: POWERLEVEL9K_PROMPT_ADD_NEWLINE=false
add_newline = false

# p10k left: dir, vcs, prompt_char
format = '$directory$git_branch$git_commit$git_state$git_status$character'

# p10k right: status, command_execution_time, background_jobs, direnv,
# tool versions, kubecontext, terraform, clouds, context
right_format = '$status$cmd_duration$jobs$direnv$python$conda$nodejs$golang$rust$dotnet$dart$ruby$lua$java$perl$erlang$elixir$php$haskell$julia$scala$nix_shell$kubernetes$terraform$gcloud$username$hostname'

continuation_prompt = "[.](bright-black) "

# prompt_char: ❯ insert, ❮ command, V visual, ▶ overwrite; fg 76 on success,
# fg 196 on error. (zsh only honors vimcmd_symbol; the rest are for fish.)
[character]
success_symbol = '[❯](76)'
error_symbol = '[❯](196)'
vimcmd_symbol = '[❮](76)'
vimcmd_visual_symbol = '[V](76)'
vimcmd_replace_symbol = '[▶](76)'
vimcmd_replace_one_symbol = '[▶](76)'

# dir: fg 31, anchor segments (home, repo root) bold 39, lock if not writable.
# p10k shortens to unique prefixes in fg 103; starship only truncates by
# level, so long paths look different.
[directory]
style = '31'
before_repo_root_style = 'bold 39'
repo_root_style = 'bold 39'
read_only = ' ro'

# vcs: no branch icon, branch fg 76, ":remote" only when it differs from the
# local branch (default fg).
[git_branch]
symbol = ''
format = '[$branch(:$remote_branch)](76) '
truncation_length = 32
truncation_symbol = '…'

# p10k shows "#tag" when detached on a tag, else "@hash8". starship can't
# hide the hash when a tag is present, so detached on a tag shows "hash#tag".
[git_commit]
format = '[$hash$tag]($style) '
style = '76'
only_detached = true
tag_disabled = false
tag_symbol = '#'
commit_hash_length = 8

# p10k: bare action word (merge, rebase, …), fg 196.
[git_state]
format = '[$state]($style) '
style = '196'

# p10k counts: ~N conflicted 196, *N stash 76, +N staged 178, !N unstaged 178,
# ?N untracked 39, ⇣/⇡ 76. Staged deletions and renames fold into +N, so
# their symbols are empty.
[git_status]
# p10k order: ahead/behind, stash, conflicts, staged, unstaged, untracked.
format = '$ahead_behind$stashed$conflicted$staged$modified$untracked'
conflicted = '[~$count](196) '
stashed = '[*$count](76) '
modified = '[!$count](178) '
staged = '[+$count](178) '
untracked = '[?$count](39) '
ahead = '[⇡$count](76) '
behind = '[⇣$count](76) '
diverged = '[⇣$behind_count⇡$ahead_count](76) '
up_to_date = ''
deleted = ''
renamed = ''
typechanged = ''

# status: p10k hides it on success and on plain errors (the prompt char
# covers those) and shows it only for signals and pipe failures, fg 160.
# starship can't hide plain errors, so this shows the code or signal name
# whenever the last command failed.
[status]
symbol = 'x '
format = '[$symbol$common]($style) '
style = '160'
not_executable_symbol = 'noexec'
not_found_symbol = 'notfound'
sigint_symbol = 'sigint'
signal_symbol = 'sig'

# command_execution_time: threshold 0, 2 decimals, fg 101, no "took" prefix.
[cmd_duration]
min_time = 0
show_milliseconds = true
format = '[$duration]($style) '
style = '101'

# background_jobs: symbol only, no count, fg 70.
[jobs]
style = '70'
number_threshold = 999999

# direnv: fg 178. Disabled by default in starship.
[direnv]
disabled = false
style = '178'

# Tool versions: colors from p10k asdf/virtualenv/rbenv/luaenv/jenv/plenv/
# phpenv/scalaenv/haskell_stack segments.
[python]
symbol = 'py '
style = '37'

[conda]
symbol = 'conda '
style = '37'

[nodejs]
symbol = 'nodejs '
style = '70'

[golang]
symbol = 'go '
style = '37'

[rust]
symbol = 'rs '
style = '37'

[dotnet]
symbol = '.NET '
style = '134'
format = "via [$symbol($version )(target $tfm )]($style) "

# asdf flutter
[dart]
symbol = 'dart '
style = '38'

[ruby]
symbol = 'rb '
style = '168'

[lua]
symbol = 'lua '
style = '32'

[java]
symbol = 'java '
style = '32'

[perl]
symbol = 'pl '
style = '67'

[erlang]
symbol = 'erl '
style = '125'

[elixir]
symbol = 'exs '
style = '129'

[php]
symbol = 'php '
style = '99'

[haskell]
symbol = 'haskell '
style = '172'

[julia]
symbol = 'jl '
style = '70'

[scala]
symbol = 'scala '
style = '160'

[nix_shell]
symbol = 'nix '
style = '74'

# kubecontext: fg 134. p10k shows it only while typing kubectl/helm/etc.;
# starship shows it whenever a context is set.
[kubernetes]
symbol = 'kubernetes '
style = '134'

# terraform: fg 38. p10k hides the "default" workspace; starship can't.
[terraform]
symbol = 'terraform '
style = '38'

# gcloud: fg 32. p10k shows it only while typing gcloud/gcs.
[gcloud]
symbol = 'gcp '
style = '32'

# context: p10k shows user@host only when root (bold, fg 178) or in SSH
# (fg 180). Local root shows "user@" with no host, since starship only
# shows the hostname over SSH.
[username]
format = '[$user@]($style)'
style_user = '180'
style_root = 'bold 178'

[hostname]
ssh_only = true
format = '[$hostname]($style) '
style = '180'

# Not ported from p10k (no starship equivalent): todo, timewarrior,
# taskwarrior, nordvpn, ranger, nnn, vim_shell, midnight_commander,
# aws_eb_env, google_app_cred, postgres.
# p10k gates aws/azure on the typed command; starship has no such option, so
# they stay out of the prompt rather than show all the time.
# p10k hides git status in the home dir (VCS_DISABLED_WORKDIR_PATTERN='~');
# starship has no equivalent.
