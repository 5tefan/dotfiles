- defaults:
    link:
      relink: true
    shell:
      stdout: true
      stderr: true

- clean: ["~"]

- shell:
    - description: Installing submodules
      command: git submodule update --init --recursive
    - description: Configure .*-common.sh
      command: |
        grep -qxsF '[ -f ~/.bash-common.sh ] && source ~/.bash-common.sh' ~/.bashrc || echo '[ -f ~/.bash-common.sh ] && source ~/.bash-common.sh' >> ~/.bashrc;
        grep -qxsF '[ -f ~/.zsh-common.zsh ] && source ~/.zsh-common.zsh' ~/.zshrc || echo '[ -f ~/.zsh-common.zsh ] && source ~/.zsh-common.zsh' >> ~/.zshrc;
    - description: Install Homebrew if missing (macOS only)
      command: |
        if [ "$(uname)" = Darwin ] && [ ! -x /opt/homebrew/bin/brew ]; then
          /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)";
        fi
    - description: Set up Homebrew if missing (macOS only)
      command: |
        if [ "$(uname)" = Darwin ]; then
          grep -qxsF 'eval "$(/opt/homebrew/bin/brew shellenv)"' ~/.bash_profile || echo 'eval "$(/opt/homebrew/bin/brew shellenv)"' >> ~/.bash_profile;
          grep -qxsF 'eval "$(/opt/homebrew/bin/brew shellenv)"' ~/.zprofile || echo 'eval "$(/opt/homebrew/bin/brew shellenv)"' >> ~/.zprofile;
        fi
    - description: Install Homebrew packages (macOS only)
      command: |
        if [ "$(uname)" = Darwin ] && [ -x /opt/homebrew/bin/brew ]; then
          /opt/homebrew/bin/brew bundle --file Brewfile;
        fi
- link:
    ~/.config: config
    ~/.local: local
    ~/.tmux.conf: tmux.conf
    ~/.tmux: tmux
    ~/.vim: vim
    ~/.vimrc: vimrc
    ~/.gitconfig: gitconfig
    ~/.gitignore: gitignore
    ~/.lynxrc: lynxrc
    ~/.git-prompt.sh: git-prompt.sh
    ~/.bash-common.sh: bash-common.sh
    ~/.zsh-common.zsh: zsh-common.zsh
    ~/.z.sh: z/z.sh

- link:
    ~/.agents/skills/:
      path: agents/skills/*
      glob: true
      create: true
      force: false
    ~/.claude/skills/:
      path: agents/skills/*
      glob: true
      create: true
      force: false

- shell:
    - description: Build zed-pr-review
      command: cargo build --locked --release --manifest-path ~/.config/zed/zed-pr-review/Cargo.toml
