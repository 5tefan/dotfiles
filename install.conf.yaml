- defaults:
    link:
      relink: true
    shell:
      stdout: true
      stderr: true

- clean: ["~"]

- shell:
    - description: Installing submodules
      command: git submodule update --init --recursive
    - description: Configure bash to source ~/.bash-common.sh
      command: |
        grep -qxsF '[ -f ~/.bash-common.sh ] && source ~/.bash-common.sh' ~/.bashrc || echo '[ -f ~/.bash-common.sh ] && source ~/.bash-common.sh' >> ~/.bashrc
    - description: Configure zsh to source ~/.zsh-common.zsh
      command: |
        grep -qxsF '[ -f ~/.zsh-common.zsh ] && source ~/.zsh-common.zsh' ~/.zshrc || echo '[ -f ~/.zsh-common.zsh ] && source ~/.zsh-common.zsh' >> ~/.zshrc

- link:
    ~/.config: config
    ~/.local: local
    ~/.tmux.conf: tmux.conf
    ~/.tmux: tmux
    ~/.vim: vim
    ~/.vimrc: vimrc
    ~/.gitconfig: gitconfig
    ~/.gitignore: gitignore
    ~/.lynxrc: lynxrc
    ~/.git-prompt.sh: git-prompt.sh
    ~/.bash-common.sh: bash-common.sh
    ~/.p10k.zsh: p10k.zsh
    ~/.zsh-common.zsh: zsh-common.zsh
    ~/.z.sh: z/z.sh
